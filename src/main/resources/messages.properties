# Detail of the 400 answer for a page or size out of range. Spring looks the text up by the exception's
# default reason ("Validation failure"); {0} is the list of broken rules.
Validation\ failure=Invalid request parameters: {0}
# One broken rule: {0} is the parameter name, {1} the limit.
Min={0} must be greater than or equal to {1,number,#}
Max={0} must be less than or equal to {1,number,#}
