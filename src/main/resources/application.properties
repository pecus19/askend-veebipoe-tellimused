spring.application.name=orders

# Local run against docker compose's postgres. In the container the same keys come from
# SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD (see docker-compose.yml).
spring.datasource.url=jdbc:postgresql://localhost:5433/orders
spring.datasource.username=orders
spring.datasource.password=orders

# Liquibase owns the schema; Hibernate only checks that the entities match it.
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.contexts=demo
spring.jpa.hibernate.ddl-auto=validate
# Lazy data is loaded in the service transaction, never while writing the response.
spring.jpa.open-in-view=false

# Errors as RFC 9457 problem+json (Spring's own handler); the texts are in messages.properties.
spring.mvc.problemdetails.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
